<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Clone Detector</title>
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --human-color: #22c55e;
            --fake-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at top right, rgba(56, 189, 248, 0.1), transparent 400px);
        }

        h1 {
            color: var(--accent);
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .container {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        #status {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 30px 0;
            padding: 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
        }

        .human {
            background: rgba(34, 197, 94, 0.2) !important;
            color: var(--human-color);
            border: 2px solid var(--human-color);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.3);
        }

        .fake {
            background: rgba(239, 68, 68, 0.2) !important;
            color: var(--fake-color);
            border: 2px solid var(--fake-color);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            from {
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            }

            to {
                box-shadow: 0 0 40px rgba(239, 68, 68, 0.8);
            }
        }

        #start-btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        #start-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 25px rgba(37, 99, 235, 0.4);
        }

        #prob-bar-container {
            width: 100%;
            height: 10px;
            background: #cbd5e1;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }

        #prob-bar {
            height: 100%;
            width: 0%;
            background: var(--fake-color);
            transition: width 0.3s ease;
        }

        .info {
            color: #94a3b8;
            margin-top: 20px;
            font-size: 0.9rem;
        }
    </style>
    <!-- WaveSurfer.js CDN -->
    <script src="https://unpkg.com/wavesurfer.js@6.6.5/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@6.6.5/dist/plugin/wavesurfer.spectrogram.min.js"></script>
</head>

<body>
    <div class="container">
        <h1>Voice Clone Detector</h1>
        <p class="info">Real-time analysis monitoring for synthetic audio anomalies</p>

        <div id="status">Standby</div>
        <div id="prob-bar-container">
            <div id="prob-bar"></div>
        </div>

        <button id="start-btn">Initialize Live Feed</button>
        <!-- Visualization containers -->
        <div id="waveform" style="margin-top:20px;"></div>
        <div id="spectrogram" style="margin-top:10px;height:150px;"></div>
    </div>

    <script>
        const btn = document.getElementById('start-btn');
        const statusEl = document.getElementById('status');
        const probBarContainer = document.getElementById('prob-bar-container');
        const probBar = document.getElementById('prob-bar');
        let ws;
        let mediaRecorder;
        // Initialize WaveSurfer with spectrogram plugin
        const waveSurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#38bdf8',
            progressColor: '#2563eb',
            height: 100,
            plugins: [
                WaveSurfer.Spectrogram.create({
                    container: '#spectrogram',
                    labels: true
                })
            ]
        });

        btn.onclick = async () => {
            btn.style.display = 'none';
            statusEl.innerText = 'Connecting...';

            try {
                ws = new WebSocket("ws://localhost:8002/ws");

                ws.onopen = async () => {
                    statusEl.innerText = 'Listening (Awaiting Chunks)...';
                    probBarContainer.style.display = 'block';

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                            ws.send(e.data);
                            // Load the audio blob into WaveSurfer for visualization
                            waveSurfer.loadBlob(e.data);
                        }
                    };

                    // Start transmitting audio every 1 second
                    mediaRecorder.start(1000);
                };

                ws.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    const isFake = data.label === "AI-GENERATED";
                    const prob = data.fake_prob * 100;

                    statusEl.className = isFake ? 'fake' : 'human';
                    statusEl.innerHTML = `${data.label}<br><span style="font-size:1.2rem; font-weight:400">Threat Level: ${prob.toFixed(1)}%</span>`;

                    probBar.style.width = `${prob}%`;
                    probBar.style.background = isFake ? 'var(--fake-color)' : 'var(--human-color)';
                };

                ws.onclose = () => {
                    statusEl.className = '';
                    statusEl.innerText = 'Disconnected';
                    if (mediaRecorder) mediaRecorder.stop();
                };
            } catch (err) {
                statusEl.innerText = 'Error capturing microphone';
            }
        };
    </script>
</body>

</html>
